# Lightweight General Model - Qwen2.5-3B
# Fallback for general tasks on systems with limited VRAM

name: qwen2.5-3b-general
role: general
backend: ollama
model_id: qwen2.5:3b
context_window: 32768
num_ctx: 4096
vram_gb_min: 1.9
capabilities:
  - general-reasoning
  - conversation
  - question-answering
  - analysis
  - writing
prompt_template: default-chatml
temperature: 0.7
top_p: 0.9
description: "Lightweight general-purpose model for systems with limited VRAM. Good for basic reasoning and conversation."
fallback: qwen3.5:2b  # Fall back to router if needed
metadata:
  tier: low
  recommended_hardware: "4GB+ VRAM"
  load_time_estimate: "3s"
  tokens_per_second: "20-35"
  fully_gpu_resident: true
