# Coding Specialist Model - Qwen2.5-Coder-7B
# On-demand model for code generation and debugging

name: qwen2.5-coder-7b
role: coding
backend: ollama
model_id: qwen2.5-coder:7b
context_window: 131072
num_ctx: 8192  # Longer context for code understanding
vram_gb_min: 4.7
capabilities:
  - code-generation
  - debugging
  - code-explanation
  - refactoring
  - python
  - javascript
  - typescript
  - java
  - cpp
  - go
  - rust
  - shell
prompt_template: default-chatml
temperature: 0.2  # Lower temp for deterministic code
top_p: 0.95
description: "Specialized coding model optimized for code generation, debugging, and technical programming tasks."
fallback: qwen2.5:3b  # Fall back to general model for simple code tasks
metadata:
  tier: medium
  recommended_hardware: "6GB+ VRAM"
  load_time_estimate: "5s"
  tokens_per_second: "15-25"
  fully_gpu_resident: true
