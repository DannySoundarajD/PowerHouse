# General Reasoning Model - Qwen2.5-7B
# For general conversation, reasoning, and non-coding tasks

name: qwen2.5-7b-general
role: general
backend: ollama
model_id: qwen2.5:7b
context_window: 131072
num_ctx: 8192  # Good balance for reasoning tasks
vram_gb_min: 4.7
capabilities:
  - general-reasoning
  - conversation
  - question-answering
  - analysis
  - planning
  - writing
  - summarization
prompt_template: default-chatml
temperature: 0.7  # Balanced for general tasks
top_p: 0.9
description: "General-purpose reasoning model for conversation, analysis, and non-coding tasks. More capable than 2B models."
fallback: qwen2.5:3b  # Fall back to smaller model if needed
metadata:
  tier: medium
  recommended_hardware: "6GB+ VRAM"
  load_time_estimate: "5s"
  tokens_per_second: "15-25"
  fully_gpu_resident: true
